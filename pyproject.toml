[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polygraf-ner"
version = "0.1.0"
description = "Reproducible English NER dataset auditing and model training workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub==1.13.0",
  "pandas==3.0.2",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "reportlab==4.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
